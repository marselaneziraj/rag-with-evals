- id: g070
  question: When can a controller avoid telling affected individuals about a high-risk breach?
  reference_answer: Where the data was rendered unintelligible, for example by encryption; where subsequent
    measures eliminated the high risk; or where individual communication would involve disproportionate
    effort, in which case a public communication is required instead.
  answerable: true
  gold_sources:
  - source: gdpr_essentials.pdf
    page: 3
