- id: g077
  question: How many lawful bases for processing does Article 6 provide, and what are they?
  reference_answer: 'Six: consent, performance of a contract, compliance with a legal obligation, protection
    of vital interests, a task in the public interest or official authority, and legitimate interests.'
  answerable: true
