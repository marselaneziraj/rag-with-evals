items:
- id: g001
  question: How is the internal risk score calculated?
  reference_answer: Likelihood from 1 to 4 multiplied by severity from 1 to 4, giving a score from 1 to
    16.
  answerable: true
  gold_sources:
  - source: dpia_governance_playbook.pdf
    page: 1
  tags:
  - playbook
  - risk
  difficulty: easy
  notes: ''
- id: g002
  question: What conditions must be met for the right to data portability to apply?
  reference_answer: Processing must be based on consent or contract and carried out by automated means;
    the data is then provided in a structured, commonly used, machine-readable format.
  answerable: true
  gold_sources:
  - source: gdpr_essentials.pdf
    page: 2
  tags:
  - gdpr
  - data_subject_rights
  difficulty: medium
  notes: ''
- id: g003
  question: What information must be provided under the right of access in Article 15?
  reference_answer: Confirmation of processing, access to the data, and information on purposes, categories
    of data, recipients, retention periods, the existence of the other rights, the source of the data,
    and the existence of automated decision-making.
  answerable: true
  gold_sources:
  - source: gdpr_essentials.pdf
    page: 2
  tags:
  - gdpr
  - data_subject_rights
  difficulty: medium
  notes: ''
- id: g004
  question: What happens to a model whose evaluation is more than twelve months old?
  reference_answer: It is withdrawn from production until re-evaluated; at more than six months it is
    flagged.
  answerable: true
  gold_sources:
  - source: dpia_governance_playbook.pdf
    page: 2
