- id: g079
  question: What does the accountability principle require of a controller?
  reference_answer: The controller is responsible for compliance with all the Article 5 principles and
    must be able to demonstrate that compliance, which is why documentation is a legal requirement.
  answerable: true
  gold_sources:
  - source: gdpr_essentials.pdf
    page: 1
