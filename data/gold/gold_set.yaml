- id: g036
  question: Which processing activities trigger an internal assessment?
  reference_answer: Automated decisions with legal or similarly significant effects, large-scale special
    category data, systematic monitoring of a public area, matching or combining data sets, data on vulnerable
    subjects including children and employees, innovative technology, or processing that blocks a right
    or a service.
  answerable: true
  gold_sources:
