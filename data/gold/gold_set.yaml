  notes: Corpus does not cover this; the only correct behaviour is refusal.
- id: g072
  question: How does the AI Act define an AI system?
  reference_answer: A machine-based system designed to operate with varying levels of autonomy, that may
    exhibit adaptiveness after deployment, and that infers from its input how to generate outputs such
    as predictions, content, recommendations or decisions influencing physical or virtual environments.
  answerable: true
  gold_sources:
  - source: ai_act_overview.pdf
    page: 1
  tags:
  - ai_act
  - definitions
  difficulty: easy
  notes: ''
- id: g073
  question: How easy must it be to withdraw consent?
  reference_answer: Withdrawal must be as easy as giving consent, and the data subject may withdraw at
    any time.
  answerable: true
  gold_sources:
  - source: gdpr_essentials.pdf
    page: 1
  tags:
  - gdpr
  - consent
  difficulty: easy
  notes: ''
- id: g074
  question: What happens if the residual risk score is 12 or above?
  reference_answer: It may not be accepted internally and requires prior consultation of the supervisory
    authority before processing begins.
