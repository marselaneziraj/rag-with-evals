- id: g012
  question: When is a data protection impact assessment mandatory under Article 35?
  reference_answer: Where processing is likely to result in a high risk, in particular for systematic
    and extensive automated evaluation producing legal or similarly significant effects, large-scale processing
    of special categories or criminal conviction data, and large-scale systematic monitoring of a publicly
    accessible area.
  answerable: true
  gold_sources:
  - source: gdpr_essentials.pdf
    page: 3
  tags:
  - gdpr
  - dpia
  difficulty: medium
  notes: ''
