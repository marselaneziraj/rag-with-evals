- id: g037
  question: Can an Annex III system avoid the high-risk classification?
  reference_answer: Yes, where it performs a narrow procedural task, improves a previously completed human
    activity, detects decision patterns without replacing human assessment, or performs a preparatory
    task; but a system that profiles natural persons is always high-risk.
  answerable: true
  gold_sources:
  - source: ai_act_overview.pdf
    page: 1
