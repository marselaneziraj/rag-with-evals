  - principles
  difficulty: medium
  notes: ''
- id: g080
  question: What is the deadline for responding to a data subject request, and can it be extended?
  reference_answer: Without undue delay and within one month of receipt; it may be extended by two further
    months where necessary, provided the data subject is told of the extension and the reasons within
    one month of receipt.
  answerable: true
  gold_sources:
