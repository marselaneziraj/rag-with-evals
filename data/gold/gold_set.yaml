- id: g044
  question: What does data protection by default require about accessibility of personal data?
  reference_answer: By default personal data must not be made accessible, without the individual's intervention,
    to an indefinite number of natural persons; defaults must also limit the amount collected, the extent
    of processing, and the storage period.
  answerable: true
  gold_sources:
  - source: gdpr_essentials.pdf
    page: 2
  tags:
  - gdpr
  - privacy_by_design
  difficulty: medium
  notes: ''
- id: g045
  question: From when do the Annex III high-risk obligations apply?
  reference_answer: From 2 August 2026, the date of general application; for high-risk systems that are
    safety components of Annex I products, from 2 August 2027.
  answerable: true
  gold_sources:
  - source: ai_act_overview.pdf
    page: 3
  tags:
  - ai_act
  - timeline
  difficulty: medium
  notes: ''
- id: g046
  question: Which security measures does Article 32 list as appropriate?
  reference_answer: Pseudonymisation and encryption; ensuring ongoing confidentiality, integrity, availability
    and resilience; the ability to restore availability and access in a timely manner after an incident;
    and a process for regularly testing and evaluating effectiveness.
  answerable: true
  gold_sources:
  - source: gdpr_essentials.pdf
    page: 3
  tags:
  - gdpr
  - security
  difficulty: easy
  notes: ''
