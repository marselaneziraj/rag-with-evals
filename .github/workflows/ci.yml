name: ci

# The whole point of the offline backend: every pull request re-runs the full
# evaluation, the configuration sweep and the prompt-injection suite, with no
# API key and no model download, and fails if the metrics regress.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests app scripts

      - name: Unit tests
        run: pytest tests -q --cov=src/ragevals --cov-report=term-missing

  evaluate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build the demo corpus and index
        run: |
          python -m ragevals.cli samples
          python -m ragevals.cli ingest --config configs/default.yaml

      - name: Gold set validation
        run: python -m ragevals.cli gold-stats --gold data/gold/gold_set.yaml

      - name: Evaluate
        run: python -m ragevals.cli evaluate --config configs/default.yaml

      - name: Configuration sweep
        run: python -m ragevals.cli experiment --sweep configs/experiments/sweep.yaml

      - name: Prompt-injection suite
        run: python -m ragevals.cli injection --config configs/default.yaml

      - name: Regression gate
        run: python scripts/check_thresholds.py --results results

      - name: Assemble the report
        run: python -m ragevals.cli report --results results --out RESULTS.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evaluation-results
          path: |
            results/
            RESULTS.md
          retention-days: 30

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t rag-with-evals .
      - name: Smoke test the image
        run: docker run --rm rag-with-evals python -m ragevals.cli ask
          --config configs/default.yaml "Within what time must a breach be notified?"
